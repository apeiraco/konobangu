# cargo-features = ["codegen-backend"]
cargo-features = ["profile-rustflags"]

[workspace]
members = [
  "packages/testing-torrents",
  "packages/util",
  "packages/util-derive",
  "packages/fetch",
  "packages/downloader",
  "apps/recorder",
  "apps/proxy",
  "packages/animeta",
]
resolver = "2"

[profile.dev]
# [simd not supported by cranelift](https://github.com/rust-lang/rustc_codegen_cranelift/issues/171)
# codegen-backend = "cranelift"

[workspace.dependencies]
testing-torrents = { path = "./packages/testing-torrents" }
util = { path = "./packages/util" }
util-derive = { path = "./packages/util-derive" }
fetch = { path = "./packages/fetch" }
downloader = { path = "./packages/downloader" }
recorder = { path = "./apps/recorder" }
animeta = { path = "./packages/animeta" }

reqwest = { version = "0.13", features = [
  "charset",
  "http2",
  "json",
  "cookies",
  "form",
] }
moka = "0.12"
futures = "0.3"
quirks_path = "0.1"
snafu = { version = "0.9", features = ["futures"] }
testcontainers = { version = "0.27" }
testcontainers-modules = { version = "0.15" }
testcontainers-ext = { version = "0.2.1", features = ["tracing"] }
serial_test = "3"
ctor = "0.8"
rstest = "0.26"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.51", features = [
  "macros",
  "fs",
  "rt-multi-thread",
  "signal",
] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
url = "2.5.8"
anyhow = "1"
itertools = "0.14"
chrono = "=0.4.41"
bytes = "1"
serde_with = "3"
regex = "1.12"
fancy-regex = "0.17"
lazy_static = "1.5"
axum = { version = "0.8.8", features = ["macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
mockito = { version = "1.7" }
tracing-test = "0.2"
convert_case = "0.11"
color-eyre = "0.6.5"
inquire = "0.9"
image = "0.25"
uuid = { version = "1.23.0", features = ["v7"] }
maplit = "1.0.2"
once_cell = "1.21.4"
rand = "0.10"
rust_decimal = "1.41.0"
base64 = "0.22.1"
nom = "8.0.0"
percent-encoding = "2.3.2"
num-traits = "0.2.19"
http = "1.4.0"
async-stream = "0.3.6"
serde_variant = "0.1.3"
tracing-appender = "0.2.4"
clap = "4.6.0"
ipnetwork = "0.21.1"
typed-builder = "0.23"
nanoid = "0.4.0"
webp = "0.3.1"
icu = "2.2.0"
icu_properties = "2.2.0"

[profile.dev.package.polars]
rustflags = ["-Zhint-mostly-unused"]

[profile.release.package.polars]
rustflags = ["-Zhint-mostly-unused"]

