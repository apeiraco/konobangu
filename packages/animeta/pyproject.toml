[project]
name = "konobangu-animeta"
version = "0.1.0"
description = "Anime metadata toolset of konobangu project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "polars>=1",
  "pyarrow>=15",
  "datasets>=3.0",
  "transformers>=4.46",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "rich>=13.0",
  "tqdm>=4.66",
]

[project.scripts]
animeta-mikan-demo = "konobangu_animeta.demo_mikan:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/konobangu_animeta"]

[tool.uv]
package = true

# Prefer CPU wheels to avoid multi‑GB CUDA stacks for this demo/tooling package.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
