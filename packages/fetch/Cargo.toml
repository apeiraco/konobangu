[package]
name = "fetch"
version = "0.1.0"
edition = "2024"

[dependencies]
snafu = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_with = { workspace = true }
lazy_static = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
async-trait = { workspace = true }
moka = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
leaky-bucket = "1.1"
http-cache-reqwest = { version = "1.0.0-alpha.5", features = [
    "manager-cacache",
    "manager-moka",
] }
http-cache-semantics = "3"
fastrand = "2.3"
reqwest-middleware = { version = "0.5", features = ["form"] }
reqwest-retry = "0.9"
reqwest-tracing = "0.7"
http-cache = { version = "1.0.0-alpha.5", features = [
    "manager-cacache",
    "manager-moka",
], default-features = false }
reqwest_cookie_store = { version = "0.10", features = ["serde"] }
http-serde = "2.1.1"

util = { workspace = true }
