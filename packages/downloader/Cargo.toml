[package]
name = "downloader"
version = "0.1.0"
edition = "2024"

license = "MIT"
repository = "https://github.com/apeiraco/konobangu"
publish = false
[features]
default = []
# Enable integration tests; their container dependencies remain development-only.
testcontainers = []

[[test]]
name = "qbit-lifecycle"
path = "tests/integration/qbit-lifecycle.test.rs"
required-features = ["testcontainers"]

[[test]]
name = "rqbit-lifecycle"
path = "tests/integration/rqbit-lifecycle.test.rs"
required-features = ["testcontainers"]

[dependencies]
futures = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
snafu = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
quirks_path = { workspace = true }
itertools = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }

serde-value = "0.7"
qbit-rs = { version = "=0.6.0", default-features = false, features = ["reqwest", "rustls-tls", "builder"] }
merge-struct = "0.1"
librqbit-core = "=9.0.1"
librqbit = { version = "=9.0.1", features = [
    "async-bt",
    "watch",
] }

util = { workspace = true }
fetch = { workspace = true }


[dev-dependencies]
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
testcontainers-ext = { workspace = true }
testing-torrents = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
mockito = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
