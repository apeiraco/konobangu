[project]
name = "konobangu-animeta"
version = "0.1.0"
description = "Anime metadata toolset of konobangu project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.39",
  "pyarrow>=23",
  "datasets>=4.8",
  "transformers>=5.5",
  "sentence-transformers>=5.4",
  "torch>=2.11",
  "rich>=14.3",
  "tqdm>=4.67",
]

[project.scripts]
animeta-mikan-demo = "konobangu_animeta.demo_mikan:main"

[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konobangu_animeta"]

[tool.uv]
package = true

# Prefer CPU wheels to avoid multi‑GB CUDA stacks for this demo/tooling package.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
