name: Repository tooling
description: Install managed tools, native prerequisites and frozen Node workspaces.
inputs:
  extra-tools:
    description: Space-separated mise tools to activate alongside just, Node and pnpm.
    default: rust
  browser:
    description: Install Chromium and its host libraries.
    default: 'false'
  cache-mode:
    description: >
      Ownership of the mise tools and pnpm store. Use read-write for the
      single owner, read-only for consumers, or none to disable cache access.
    default: read-only
  browser-cache-mode:
    description: Independent browser cache ownership for the browser runner.
    default: read-only
runs:
  using: composite
  steps:
    - name: Select job tools
      shell: bash
      env:
        EXTRA_TOOLS: ${{ inputs.extra-tools }}
        CACHE_MODE: ${{ inputs.cache-mode }}
      run: |
        echo "MISE_ENV=ci" >> "$GITHUB_ENV"
        if [[ "$CACHE_MODE" != read-write ]]; then
          tools="just,node,pnpm${EXTRA_TOOLS:+,${EXTRA_TOOLS// /,}}"
          echo "MISE_ENABLE_TOOLS=$tools" >> "$GITHUB_ENV"
        fi
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        install: true
        cache: ${{ inputs.cache-mode != 'none' }}
        cache_save: ${{ inputs.cache-mode == 'read-write' }}
        cache_key_prefix: mise-konobangu-v2
    - name: Linux build prerequisites
      if: runner.os == 'Linux' && contains(inputs.extra-tools, 'rust')
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential nasm pkg-config libssl-dev
    - name: macOS assembler
      if: runner.os == 'macOS' && contains(inputs.extra-tools, 'rust')
      shell: bash
      run: brew install nasm
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows' && contains(inputs.extra-tools, 'rust')
    - name: Windows assembler
      if: runner.os == 'Windows' && contains(inputs.extra-tools, 'rust')
      shell: pwsh
      run: |
        choco install nasm -y --no-progress
        "C:\Program Files\NASM" >> $env:GITHUB_PATH
    # The store lives outside the workspace and differs per platform, so ask pnpm
    # rather than assuming a path for the Windows and macOS runners.
    - name: Resolve the pnpm store
      if: inputs.cache-mode != 'none'
      id: pnpm-store
      shell: bash
      run: echo "path=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Restore the pnpm store
      if: inputs.cache-mode != 'none'
      id: pnpm-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'packages/testing-torrents/pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
    - name: Install frozen workspaces
      shell: bash
      run: |
        mise exec -- pnpm install --frozen-lockfile
        mise exec -- pnpm --dir packages/testing-torrents install --frozen-lockfile
    - name: Save the pnpm store
      if: inputs.cache-mode == 'read-write' && steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
    - name: Restore the browser fixture
      if: inputs.browser == 'true' && inputs.browser-cache-mode != 'none'
      id: browser-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/webui/package.json') }}
        restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-
    - name: Install the browser fixture
      if: inputs.browser == 'true'
      shell: bash
      run: |
        mise install node@24.15.0
        mise exec -- pnpm --filter webui exec playwright install --with-deps chromium
        mise exec node@24.15.0 -- pnpm dlx playwright@1.51.1 install chromium --only-shell
    - name: Save the browser fixture
      if: inputs.browser == 'true' && inputs.browser-cache-mode == 'read-write' && steps.browser-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser-cache.outputs.cache-primary-key }}
