# Credentials belong in canonical environment variables or file secrets.
[server]
binding = "0.0.0.0"
port = 5001
host = "localhost" # Override with SERVER__HOST.

[server.middlewares.etag]
enable = true
[server.middlewares.request_id]
enable = true
[server.middlewares.logger]
enable = true
[server.middlewares.catch_panic]
enable = true
# Milliseconds; disabled unless explicitly enabled.
[server.middlewares.timeout_request]
enable = false
timeout = 5000
[server.middlewares.cors]
enable = true
# For credentialed cross-origin access, use explicit origins, headers and methods.
# allow_origins = ["https://webui.example.com"]
# allow_headers = ["content-type", "x-csrf-token"]
# allow_methods = ["GET", "POST", "OPTIONS"]
# allow_credentials = true
# max_age = 3600 # Seconds.
[server.middlewares.compression]
enable = true

[logger]
# Console logging; file output is enabled separately below.
enable = true
pretty_backtrace = true
# off, error, warn, info, debug, trace; format: compact, pretty, json.
level = "info"
format = "compact"
# Valid RUST_LOG takes precedence; otherwise use this filter or the module defaults.
# override_filter = "recorder=debug,tower_http=info,sea_orm=warn"

# Optional rolling file output. Uncomment the whole table to enable it.
# Paths are relative to the process working directory, not this configuration file.
# [logger.file_appender]
# enable = true
# non_blocking = true
# level = "info" # Further restricts events allowed by the global filter.
# format = "json"
# rotation = "daily" # minutely, hourly, daily, never.
# dir = "./logs"
# filename_prefix = "recorder"
# filename_suffix = "log"
# max_log_files = 7

# Keep the existing development pool behavior; field regrouping is not tuning.
[database.pool]
# SQL logging is a separate switch; logger filters can still suppress SQL events.
log_queries = true
min_connections = 1
max_connections = 10
connect_timeout_ms = 500
idle_timeout_ms = 500

# Startup runs owner migrations before opening capability-restricted runtime pools.
# Optional migration.url selects a separate owner credential.
[database.migration]
auto_run = true

[storage]
data_dir = "./data"

# Media defaults follow the compiled codec capabilities; see documentation 015.
[media.encoding.webp]
quality = 80

[media.execution]
deadline_seconds = 30
queue_capacity = 8
working_set_bytes = 536870912
concurrency = 1

# media.auto_optimize_formats inherits JXL + WebP (WebP in trimmed builds).
# JPXL preset is fixed in code; AVIF remains explicit API only.

[mikan]
base_url = "https://mikanani.me/"

[mikan.http_client]
exponential_backoff_max_retries = 3
leaky_bucket_max_tokens = 2
leaky_bucket_initial_tokens = 1
leaky_bucket_refill_tokens = 1
leaky_bucket_refill_interval = 500

[graphql]
# Omit limits to inherit the default policy.
# depth_limit = inf
# complexity_limit = inf
