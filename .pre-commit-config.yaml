repos:
    - repo: local
      hooks:
          - id: pnpm-lint
            name: pnpm lint
            entry: pnpm lint
            language: system
            pass_filenames: false
            stages: [commit]
          - id: cargo-clippy
            name: cargo clippy --workspace
            entry: cargo clippy --workspace
            language: system
            pass_filenames: false
            stages: [commit]
